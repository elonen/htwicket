name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make test-and-check

  # Build .deb packages for each arch on a native runner (no QEMU), covering
  # both the trixie baseline and oldstable bookworm. Uploaded as artifacts and,
  # on a v* tag, attached to the GitHub release by the `release` job.
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb packages (trixie + bookworm)
        run: |
          for debver in trixie bookworm; do
            DEBIAN_VER=$debver TARGET_ARCH=${{ matrix.arch }} make debian-docker-one
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist_deb/*.deb
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist_deb
      - uses: softprops/action-gh-release@v2
        with:
          files: dist_deb/*.deb

