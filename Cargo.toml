[package]
name = "htwicket"
version = "0.1.0"
edition = "2024"
description = "Auth gateway + .htpasswd user manager for nginx auth_request"
license = "MIT OR Apache-2.0"

[package.metadata.deb]
maintainer = "Jarno Elonen <elonen@iki.fi>"
copyright = "2026, Jarno Elonen <elonen@iki.fi>"
section = "net"
changelog = "debian/changelog"
depends = "$auto"
extended-description = """\
Small auth gateway and .htpasswd user manager for nginx auth_request.
A modern replacement for htadmin-style .htpasswd GUIs: login form + JWT
session cookie, backwards-compatible .htpasswd verification, and an
app-agnostic user-attribute schema exposed to upstreams as headers/claims.
"""
assets = [
    ["target/release/htwicket", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/htwicket/README", "644"],
    ["LICENSE-MIT", "usr/share/doc/htwicket/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/htwicket/LICENSE-APACHE", "644"],
    ["htwicket.example.toml", "usr/share/doc/htwicket/examples/htwicket.toml", "644"],
    ["htwicket.example.toml", "etc/htwicket.toml", "644"],
]
conf-files = ["/etc/htwicket.toml"]
maintainer-scripts = "debian/"
# Install the unit but neither enable (boot start) nor start it: htwicket needs
# /etc/htwicket.toml configured and at least one user before it can run. The
# admin finishes with `systemctl enable --now htwicket`.
systemd-units = { enable = false, start = false }

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
axum = "0.8.9"
base64 = "0.22.1"
bcrypt = "0.19.1"
cel-interpreter = "0.10.0"
clap = { version = "4.6.1", features = ["derive"] }
fd-lock = "4.0.4"
figment = { version = "0.10.19", features = ["toml", "env"] }
htpasswd-verify = "0.3.0"
# rust_crypto = pure-Rust HMAC/SHA2 (no aws-lc-rs/ring C deps — keeps the binary static-musl
# clean and the .deb free of shared-lib deps). use_pem dropped: we only use raw HS256 secrets.
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
pwhash = "1.0.0"
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
toml = "1.1.2"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
