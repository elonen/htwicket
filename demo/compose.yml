# Compose demo: using htwicket a scratch/distroless Docker image
# Run via `make demo` (builds + seeds users first).
# Production adaptation (published image, TLS, secrets, bootstrap): docs/deployment.md -> Docker Compose.
name: htwicket-demo

services:
  htwicket:
    build:
      context: ..
      dockerfile: Dockerfile.runtime
    volumes:
      - ../htwicket.example.toml:/etc/htwicket.toml:ro
      - data:/data
    # See "# PROD" comments for production deployment recommendations
    environment:
      HTWICKET_LISTEN: 0.0.0.0:52155
      HTWICKET_HTPASSWD_FILE: /data/.htpasswd
      HTWICKET_STATE_DIR: /data
      HTWICKET_INSECURE_COOKIES: true                  # PROD: "false" or remove (secure cookies require HTTPS)
      HTWICKET_MIN_PASSWORD_LEN: 4                     # PROD: "8" or greater
      HTWICKET_BASIC_AUTH_PASSTHROUGH: true            # PROD: "false", unless you have legacy clients that don't support cookies
      #HTWICKET_PASSWORD_HASH: "argon2id"              # PROD: "argon2id", unless something also else needs standard-compliant .htpasswd (bcrypt)
      HTWICKET_APP_TITLE_HTML: "<h1>Example App</h1>"  # PROD: customize or remove
      HTWICKET_DEBUG: false

    healthcheck:
      test: ["CMD", "/usr/bin/htwicket", "healthz"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    # Example "app": a PHP page showing logged-in user data
    image: php:8-cli-alpine
    command: php -S 0.0.0.0:8000 -t /var/www/app
    volumes:
      - ./app:/var/www/app:ro

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
      # - "443:443"                           # Production: publish TLS (see nginx-default.conf)
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro         # Production: nginx-terminated TLS cert + key
    depends_on:
      htwicket:
        condition: service_healthy
      app:
        condition: service_started

# Production (see docs/deployment.md -> Docker Compose): add a top-level `secrets:` block, e.g.
#   secrets:
#     htwicket_jwt: { file: ./secrets/htwicket_jwt }
# and a one-shot `htwicket-init` service running
#   user add admin --if-missing --password-env HTWICKET_ADMIN_PASSWORD --random
# that the htwicket service depends_on (condition: service_completed_successfully). With --random,
# an unset/empty HTWICKET_ADMIN_PASSWORD generates a password and prints it to the init logs.

volumes:
  data:
