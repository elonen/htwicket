# Demo nginx site: plain-http, PHP upstream. For production TLS see the commented HTTPS
# block at the bottom of this file and docs/deployment.md -> Docker Compose.
server {
    listen 80 default_server;
    server_name _;

    # Emit relative Location headers. nginx only knows its internal port (80), not the
    # published one (e.g. 8080), so absolute redirects would drop the port and send the
    # browser to http://localhost/. Relative redirects resolve against the real origin.
    absolute_redirect off;

    # HTWicket's own pages (login, logout, account, admin, healthz).
    location /htwicket/ {
        proxy_pass http://htwicket:52155;
        proxy_set_header Host $http_host;                     # full host:port — $host drops the
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # port, breaking the
    }                                                         # Origin-vs-Host CSRF check on POST

    # Internal auth_request target. Distinct from the block above because it must be
    # `internal` (external clients can't probe /auth directly) and must NOT forward the
    # request body — the subrequest only needs the inherited Cookie/Authorization.
    location = /htwicket/auth {
        internal;
        proxy_pass http://htwicket:52155/htwicket/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The protected app — one auth_request_set + proxy_set_header pair per forwarded header.
    location / {
        auth_request /htwicket/auth;
        auth_request_set $uid    $upstream_http_x_remote_user_id;
        auth_request_set $uname  $upstream_http_x_remote_user_name;
        auth_request_set $uadmin $upstream_http_x_remote_user_is_admin;
        auth_request_set $uupl   $upstream_http_x_remote_user_can_upload;
        auth_request_set $sc     $upstream_http_set_cookie;   # sliding re-mint

        proxy_set_header X-Remote-User-Id         $uid;
        proxy_set_header X-Remote-User-Name       $uname;
        proxy_set_header X-Remote-User-Is-Admin   $uadmin;
        proxy_set_header X-Remote-User-Can-Upload $uupl;
        add_header Set-Cookie $sc;                            # nginx omits it when $sc is empty

        error_page 401 = @login;
        proxy_pass http://app:8000;
    }
    location @login { return 302 /htwicket/login?rd=$request_uri; }
}

# --- Production HTTPS (commented out; the demo above serves plain http on :80) -------------
# Terminate TLS here in nginx; HTWicket stays plain-http behind it. Mount certs into the nginx
# container (uncomment the `443:443` / `./certs` lines in compose.yml), then replace the
# `server { listen 80 ... }` above with an http->https redirect plus a 443 server that keeps the
# same three location blocks:
#
#   server { listen 80 default_server; server_name _; return 301 https://$host$request_uri; }
#   server {
#       listen 443 ssl default_server;
#       server_name _;
#       ssl_certificate     /etc/nginx/certs/fullchain.pem;
#       ssl_certificate_key /etc/nginx/certs/privkey.pem;
#       absolute_redirect on;   # standard :443 -> absolute redirects resolve (drop the `off` above)
#       # ... keep the /htwicket/, `= /htwicket/auth`, and `/` location blocks from above, verbatim ...
#   }
#
# Behind https, HTWicket's insecure_cookies stays false (remove HTWICKET_INSECURE_COOKIES in compose.yml).
