# htwicket example config. Copy to /etc/htwicket.toml.
# Every key can be overridden by env: HTWICKET_LISTEN, HTWICKET_SUPERADMINS__EXPR, ...
# Scalar top-level keys also by CLI flags (highest precedence): --listen, --min-password-len, ...

listen = "127.0.0.1:52155"
base_path = "/htwicket"
htpasswd_file = "/var/www/.htpasswd"
# sidecar_file = "/var/www/.htwicket.toml"   # default: next to htpasswd_file
# state_dir = "/var/lib/htwicket"            # holds auto-generated jwt_secret
# jwt_secret = "..."                         # set explicitly for multi-instance / key control
#                                            # (or HTWICKET_JWT_SECRET / HTWICKET_JWT_SECRET_FILE=/run/secrets/...
#                                            #  to read it from a mounted Docker/Compose secret file)

# debug = false                 # true raises the log level INFO→DEBUG: traces every request and
#                               # file read/write to stdout (never secrets). Also --debug / HTWICKET_DEBUG.

insecure_cookies = false        # true only behind plain http (demo); drops Secure flag
basic_auth_passthrough = false  # true = accept Authorization: Basic on /auth (legacy scripts)
# upgrade_hash_on_login = false # rehash entries not in password_hash at successful login
# password_hash = "bcrypt"      # or "argon2id" (stronger, but those lines stop being readable by
#                               # plain nginx auth_basic). Verification reads both either way.

min_password_len = 8
session_idle_hours = 12              # sliding re-mint past half-life
session_max_days = 7            # absolute session cap

http_accept_language = true     # consult the browser's Accept-Language header for the UI locale
# default_lang = "'en'"         # CEL (string) over {username, fields.*}: fallback locale used when
#                               # Accept-Language has no catalog match (fi/fr/zh) or is disabled
#                               # above. Note the inner quotes — the value is a CEL expression, so a
#                               # literal locale is single-quoted. e.g. "'fi'" forces Finnish.

# app_title_html = "<img src=https://example.com/logo.svg alt=ACME height=40>"
#                               # Optional RAW (unescaped) HTML shown above the form on every page —
#                               # a logo, title, custom font/colors. Whitelabel branding; trusted
#                               # operator input by design, so it is NOT escaped. Leave unset for none.

[superadmins]
# Who may open /admin (htwicket's own user management) — CEL over {username, fields.*}
expr = "username == 'admin' || fields.is_admin"

# ---- App-specific schema below (example); htwicket core has no built-in notion ----
# ---- of any of these fields.                                                    ----
#
# Per field on a user's own /account page:
#   user_visible       = false   # show it (read-only) to the user. Default false (hidden).
#   user_editable_expr = "false" # CEL (bool) over {username, fields.*}: may THIS user edit it?
#                                # Default "false" (admin-only). Editable implies visible.

[fields.display_name]
type = "string"
default = ""
user_editable_expr = "true"        # anyone may edit their own display name

[fields.is_admin]
type = "bool"
default = false                    # admin-only (default user_editable_expr = "false", hidden)

[fields.can_upload]
type = "bool"
default = true
user_visible = true                # users see it read-only; only admins toggle it

[headers.X-Remote-User-Name]
type = "string"
expr = "fields.display_name != '' ? fields.display_name : username"

[headers.X-Remote-User-Is-Admin]
type = "bool"
expr = "fields.is_admin"

[headers.X-Remote-User-Can-Upload]
type = "bool"
expr = "fields.can_upload"
