{% extends "base.html" %}
{% block title %}{{ tr("Sign in") }}{% endblock %}
{% block content %}
<h1>{{ tr("Sign in") }}</h1>
{% if let Some(error) = error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="rd" value="{{ rd }}">
  <label>{{ tr("Username") }} <input name="username" autocomplete="username" required></label>
  <label>{{ tr("Password") }} <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">{{ tr("Sign in") }}</button>
</form>
{% endblock %}
