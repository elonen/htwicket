{% extends "base.html" %}
{% block title %}{{ tr("Sign in") }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ tr("Sign in") }}</h1>
  {% if let Some(error) = error %}
  <div class="alert alert--error" role="alert">
    <span class="alert-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 16.5v.5"></path></svg>
    </span>
    <p>{{ error }}</p>
  </div>
  {% endif %}
  <form method="post">
    <input type="hidden" name="rd" value="{{ rd }}">
    <label for="username">{{ tr("Username") }}
      <input id="username" name="username" value="{{ username }}" autocomplete="username"
             autocapitalize="none" spellcheck="false"{% if error.is_some() %} aria-invalid="true"{% endif %} required>
    </label>
    <label for="password">{{ tr("Password") }}
      <input id="password" type="password" name="password" autocomplete="current-password"{% if error.is_some() %} aria-invalid="true"{% endif %} required>
    </label>
    <button type="submit" class="btn-block">{{ tr("Sign in") }}</button>
  </form>
</section>
{% endblock %}
