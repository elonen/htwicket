{% extends "base.html" %}
{% block title %}{{ tr("Sign in") }}{% endblock %}
{% block content %}
<section class="card">
  {% if let Some(error) = error %}
  <div class="alert alert--error" role="alert">
    <span class="alert-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 16.5v.5"></path></svg>
    </span>
    <p>{{ error }}</p>
  </div>
  {% endif %}
  <form method="post" class="field-stack">
    <input type="hidden" name="rd" value="{{ rd }}">
    <input id="username" name="username" value="{{ username }}" placeholder="{{ tr("Username") }}"
           aria-label="{{ tr("Username") }}" autocomplete="username" autocapitalize="none"
           spellcheck="false"{% if error.is_some() %} aria-invalid="true"{% endif %} required>
    <input id="password" type="password" name="password" placeholder="{{ tr("Password") }}"
           aria-label="{{ tr("Password") }}" autocomplete="current-password"{% if error.is_some() %} aria-invalid="true"{% endif %} required>
    <button type="submit" class="btn-block">{{ tr("Sign in") }}</button>
  </form>
</section>
{% endblock %}
