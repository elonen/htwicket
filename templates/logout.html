{% extends "base.html" %}
{% block title %}{{ tr("Sign out") }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ tr("Sign out?") }}</h1>
  <p class="lede">{{ tr("You are signed in as") }} <strong class="ident">{{ username }}</strong>.</p>
  <form method="post">
    <div class="actions">
      <button type="submit">{{ tr("Sign out") }}</button>
      <a class="btn btn-secondary" href="/">{{ tr("Cancel") }}</a>
    </div>
  </form>
</section>
{% endblock %}
